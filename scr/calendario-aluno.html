<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário do Aluno | Cognu</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="page-container">
    <div class="topbar">
      <a class="btn-secondary" href="dashboard-aluno.html">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <button id="logout-btn" class="btn-logout" type="button">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
      </button>
    </div>

    <section class="internal-hero">
      <div class="hero-content">
        <div>
          <div class="hero-badge">
            <i class="fa-regular fa-calendar-check"></i>
            Calendário do Aluno
          </div>
          <h1 class="page-title">Suas mentorias agendadas</h1>
          <p class="page-subtitle">
            Visualize as sessões registradas no fluxo mock e avance para a página da mentoria.
          </p>
        </div>

        <div class="hero-mini-stats">
          <div class="mini-stat">
            <span>Perfil</span>
            <strong>Aluno</strong>
          </div>
          <div class="mini-stat">
            <span>Formato</span>
            <strong>Online</strong>
          </div>
          <div class="mini-stat">
            <span>Agenda</span>
            <strong>Mock</strong>
          </div>
          <div class="mini-stat">
            <span>Status</span>
            <strong>Ativa</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Eventos cadastrados</h2>
          <p class="section-text">Sessões criadas a partir do fluxo de pagamento mock.</p>
        </div>
      </div>

      <div id="events-list" class="cards-stack"></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireRole("aluno");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => logoutMock());
    }

    const eventsList = document.getElementById("events-list");
    const mentorias = getMentorias();
    const user = getCurrentUser();

    const mentoriasDoAluno = mentorias.filter((item) => item.aluno === user.nome);

    if (!mentoriasDoAluno.length) {
      eventsList.innerHTML = `
        <div class="empty-state">
          <i class="fa-regular fa-calendar-xmark"></i>
          <h3>Nenhuma mentoria encontrada</h3>
          <p>Conclua o fluxo de agendamento e pagamento para ver sessões aqui.</p>
        </div>
      `;
    } else {
      eventsList.innerHTML = mentoriasDoAluno.map((item) => `
        <div class="event-card">
          <div class="card-icon">
            <i class="fa-regular fa-calendar-days"></i>
          </div>
          <h3>${item.mentor}</h3>
          <p><strong>Data:</strong> ${item.data}</p>
          <p><strong>Horário:</strong> ${item.horario}</p>
          <p><strong>Status:</strong> ${item.status}</p>
          <div class="inline-actions">
            <span class="status-pill"><i class="fa-solid fa-circle-check"></i> Confirmada</span>
            <a class="btn-link" href="mentoria.html">Abrir mentoria</a>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
