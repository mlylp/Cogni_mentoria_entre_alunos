<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard do Mentor | Cognu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-container">
    <div class="page-card">
      <h1 class="page-title">Dashboard do Mentor</h1>
      <p class="page-subtitle">Login realizado com sucesso.</p>

      <button id="logout-btn" class="btn-logout" type="button">Sair</button>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireRole("mentor");

    const logoutBtn = document.getElementById("logout-btn");

    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        logoutMock();
      });
    }
  </script>
</body>
</html>
