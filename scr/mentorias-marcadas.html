<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentorias Marcadas | Cognu</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="page-container">
    <div class="topbar">
      <a class="btn-secondary" href="dashboard-mentor.html">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <button id="logout-btn" class="btn-logout" type="button">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
      </button>
    </div>

    <section class="internal-hero">
      <div class="hero-content">
        <div>
          <div class="hero-badge">
            <i class="fa-solid fa-book-open-reader"></i>
            Mentorias Marcadas
          </div>
          <h1 class="page-title">Sessões vinculadas ao mentor</h1>
          <p class="page-subtitle">
            Acompanhe os agendamentos criados no fluxo mock e visualize os dados principais de cada sessão.
          </p>
        </div>

        <div class="hero-mini-stats">
          <div class="mini-stat">
            <span>Perfil</span>
            <strong>Mentor</strong>
          </div>
          <div class="mini-stat">
            <span>Formato</span>
            <strong>Online</strong>
          </div>
          <div class="mini-stat">
            <span>Agenda</span>
            <strong>Mock</strong>
          </div>
          <div class="mini-stat">
            <span>Status</span>
            <strong>Ativo</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Lista de sessões</h2>
          <p class="section-text">Mentorias registradas e visíveis para o mentor.</p>
        </div>
      </div>

      <div id="mentor-events" class="cards-stack"></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireRole("mentor");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => logoutMock());
    }

    const mentorEvents = document.getElementById("mentor-events");
    const mentorias = getMentorias();

    if (!mentorias.length) {
      mentorEvents.innerHTML = `
        <div class="empty-state">
          <i class="fa-regular fa-calendar-xmark"></i>
          <h3>Nenhuma mentoria encontrada</h3>
          <p>As mentorias aparecerão aqui quando forem criadas no fluxo do aluno.</p>
        </div>
      `;
    } else {
      mentorEvents.innerHTML = mentorias.map((item) => `
        <div class="event-card">
          <div class="card-icon">
            <i class="fa-regular fa-user"></i>
          </div>
          <h3>${item.aluno}</h3>
          <p><strong>Data:</strong> ${item.data}</p>
          <p><strong>Horário:</strong> ${item.horario}</p>
          <p><strong>Status:</strong> ${item.status}</p>
          <div class="inline-actions">
            <span class="status-pill"><i class="fa-solid fa-circle-check"></i> Confirmada</span>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
