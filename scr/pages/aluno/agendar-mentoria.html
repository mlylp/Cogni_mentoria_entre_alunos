<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Mentoria | Cognu</title>
  <link rel="stylesheet" href="../../styles/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="page-container">
    <div class="topbar">
      <a id="back-to-profile" class="btn-secondary" href="perfil-mentor.html">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <button id="logout-btn" class="btn-logout" type="button">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
      </button>
    </div>

    <section class="internal-hero">
      <div class="hero-content">
        <div>
          <div class="hero-badge">
            <i class="fa-regular fa-calendar"></i>
            Agendamento
          </div>
          <h1 class="page-title">Escolha um horario disponivel</h1>
          <p class="page-subtitle">
            Selecione um dos horarios mock disponiveis para seguir para pagamento.
          </p>
        </div>

        <div class="hero-mini-stats">
          <div class="mini-stat">
            <span>Mentor</span>
            <strong id="mentor-stat">-</strong>
          </div>
          <div class="mini-stat">
            <span>Formato</span>
            <strong id="format-stat">-</strong>
          </div>
          <div class="mini-stat">
            <span>Horarios</span>
            <strong id="slots-stat">0 opcoes</strong>
          </div>
          <div class="mini-stat">
            <span>Status</span>
            <strong>Aberto</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Horarios disponiveis</h2>
          <p class="section-text">Selecione um horario para prosseguir com a mentoria.</p>
        </div>
      </div>

      <div id="slots-grid" class="page-grid"></div>
    </section>
  </main>

  <script src="../../scripts/auth.js"></script>
  <script>
    requireAuth();
    requireRole("aluno");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => logoutMock());
    }

    function formatDateDisplay(date) {
      const [year, month, day] = date.split("-");
      return `${day}/${month}/${year}`;
    }

    function resolveMentor() {
      const params = new URLSearchParams(window.location.search);
      const mentorFromQuery = Number(params.get("mentor"));

      if (mentorFromQuery) {
        const mentor = getMentorById(mentorFromQuery);
        if (mentor) {
          setSelectedMentorId(mentor.id);
          return mentor;
        }
      }

      return getSelectedMentor();
    }

    function renderSlots() {
      const mentor = resolveMentor();
      const backToProfile = document.getElementById("back-to-profile");

      if (!mentor) {
        alert("Nenhum mentor encontrado.");
        window.location.href = "buscar-mentores.html";
        return;
      }

      backToProfile.href = `perfil-mentor.html?mentor=${mentor.id}`;

      const preferredDate = sessionStorage.getItem("cognu_selected_date");
      const sortedSlots = [...mentor.slots].sort((a, b) => {
        if (!preferredDate) return 0;
        if (a.data === preferredDate && b.data !== preferredDate) return -1;
        if (b.data === preferredDate && a.data !== preferredDate) return 1;
        return `${a.data}T${a.horario}`.localeCompare(`${b.data}T${b.horario}`);
      });

      document.getElementById("mentor-stat").textContent = mentor.nome;
      document.getElementById("format-stat").textContent = `${mentor.duracao} online`;
      document.getElementById("slots-stat").textContent = `${sortedSlots.length} opcoes`;

      const slotsGrid = document.getElementById("slots-grid");
      slotsGrid.innerHTML = sortedSlots.map((slot) => `
        <div class="slot-card">
          <div class="card-icon">
            <i class="fa-regular fa-clock"></i>
          </div>
          <h3>${formatDateDisplay(slot.data)} - ${slot.horario}</h3>
          <p>Sessao individual com ${mentor.nome} via ${mentor.formato}.</p>
          <div class="inline-actions">
            <span class="status-pill"><i class="fa-solid fa-circle-check"></i> Disponivel</span>
            <a class="btn-link" data-slot-select data-slot-id="${slot.id}" href="pagamento.html?mentor=${mentor.id}&slot=${slot.id}">Selecionar</a>
          </div>
        </div>
      `).join("");

      slotsGrid.querySelectorAll("[data-slot-select]").forEach((link) => {
        link.addEventListener("click", () => {
          setSelectedMentorId(mentor.id);
          setSelectedSlot({ mentorId: mentor.id, slotId: link.dataset.slotId });
        });
      });
    }

    renderSlots();
  </script>
</body>
</html>
