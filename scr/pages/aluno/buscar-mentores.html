<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar Mentores | cogni</title>
  <link rel="stylesheet" href="../../styles/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="page-container">
    <div class="topbar">
      <a class="btn-secondary" href="dashboard.html">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>

      <button id="logout-btn" class="btn-logout" type="button">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sair
      </button>
    </div>

    <section class="internal-hero">
      <div class="hero-content">
        <div>
          <div class="hero-badge">
            <i class="fa-solid fa-magnifying-glass"></i>
            Busca de Mentores
          </div>
          <h1 class="page-title">Encontre o mentor ideal</h1>
          <p class="page-subtitle">
            Explore mentores disponiveis e avance para perfil, agendamento e pagamento.
          </p>
        </div>

        <div class="hero-mini-stats">
          <div class="mini-stat">
            <span>Resultados</span>
            <strong id="results-count">0 mentores</strong>
          </div>
          <div class="mini-stat">
            <span>Formato</span>
            <strong>Online</strong>
          </div>
          <div class="mini-stat">
            <span>Status</span>
            <strong>Disponiveis</strong>
          </div>
          <div class="mini-stat">
            <span>Fluxo</span>
            <strong>Ativos</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <div>
          <h2 class="section-title">Mentores em destaque</h2>
          <p class="section-text">Selecione um mentor para visualizar mais detalhes.</p>
        </div>
      </div>

      <div id="mentors-grid" class="page-grid"></div>
    </section>
  </main>

  <script src="../../scripts/auth.js"></script>
  <script>
    requireAuth();
    requireRole("aluno");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => logoutMock());
    }

    const resultsCount = document.getElementById("results-count");
    const mentorsGrid = document.getElementById("mentors-grid");

    function renderMentors() {
      const mentors = getMentors();
      resultsCount.textContent = `${mentors.length} mentores`;

      if (!mentors.length) {
        mentorsGrid.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-face-frown"></i>
            <h3>Nenhum mentor encontrado</h3>
            <p>Os mentores serao exibidos aqui.</p>
          </div>
        `;
        return;
      }

      mentorsGrid.innerHTML = mentors.map((mentor) => `
        <div class="mentor-card">
          <div class="card-icon">
            <i class="${mentor.icon || "fa-solid fa-user"}"></i>
          </div>
          <h3>${mentor.nome}</h3>
          <p>${mentor.bio}</p>
          <div class="inline-actions">
            <span class="status-pill"><i class="fa-solid fa-circle-check"></i> ${mentor.status}</span>
            <a class="btn-link" data-mentor-link data-mentor-id="${mentor.id}" href="perfil-mentor.html?mentor=${mentor.id}">Ver perfil</a>
          </div>
        </div>
      `).join("");

      mentorsGrid.querySelectorAll("[data-mentor-link]").forEach((link) => {
        link.addEventListener("click", () => {
          setSelectedMentorId(link.dataset.mentorId);
          clearSelectedSlot();
        });
      });
    }

    renderMentors();
  </script>
</body>
</html>
