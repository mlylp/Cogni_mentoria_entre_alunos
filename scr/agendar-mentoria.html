<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Agendar Mentoria | Cognu</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="page-container">
    <div class="topbar">

        <h1 class="page-title">Agendar Mentoria</h1>

      </div>

      <button id="logout-btn" class="btn-logout" type="button">Sair</button>

    <section class="page-card">

          <h3>15/03/2026 - 19:00</h3>
          <p>Mentor: Carlos Henrique</p>
          <a class="btn-link" href="pagamento.html">Selecionar</a>

        <div class="slot-card">

          <p>Mentor: Carlos Henrique</p>
          <a class="btn-link" href="pagamento.html">Selecionar</a>
        </div>
      </div>

  </main>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireRole("aluno");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        logoutMock();
      });
    }
  </script>
