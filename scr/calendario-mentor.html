<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário do Mentor | Cognu</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="page-container">
    <div class="topbar">
      <div>
        <h1 class="page-title">Calendário do Mentor</h1>
        <p class="page-subtitle">Agenda mock das mentorias.</p>
      </div>

      <button id="logout-btn" class="btn-logout" type="button">Sair</button>
    </div>

    <section class="page-card">
      <div class="info-list">
        <div class="info-item">15/03/2026 - 19:00 - Mentoria com Aluno</div>
        <div class="info-item">16/03/2026 - 20:00 - Horário disponível</div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    requireAuth();
    requireRole("mentor");

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        logoutMock();
      });
    }
  </script>
</body>
</html>
